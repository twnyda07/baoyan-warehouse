<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>寶嚴倉庫管理　內部入口</title>
<style>
  :root{ --baoyan:#0b3c5d; --gold:#9c7a3c; --ink:#1a1a1a; --line:#d8dee4; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#eef3f7 0%,#dde7ef 100%); color:var(--ink);
        font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif; padding:20px; }
  .gate{ width:100%; max-width:640px; background:#fff; border:1px solid var(--line); border-radius:18px;
         padding:38px 30px 30px; box-shadow:0 10px 40px rgba(11,60,93,.13); text-align:center; }
  .mark{ font-size:14px; letter-spacing:.32em; color:var(--baoyan); margin-bottom:12px; }
  h1{ font-size:26px; line-height:1.45; margin:0 0 8px; color:var(--baoyan); font-weight:700; }
  .sub{ font-size:16px; color:#5a6b7a; margin:0 0 26px; line-height:1.7; }
  .doors{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:560px){ .doors{ grid-template-columns:1fr; } }
  .door{ border:2px solid var(--line); border-radius:14px; padding:22px 16px; cursor:pointer;
         background:#fbfcfd; text-align:center; transition:.15s; }
  .door:hover{ border-color:var(--baoyan); background:#f2f7fb; }
  .door.on{ border-color:var(--baoyan); background:#eaf2f8; box-shadow:0 0 0 3px rgba(11,60,93,.1); }
  .door .ico{ font-size:34px; line-height:1; }
  .door .t{ font-size:21px; font-weight:700; color:var(--baoyan); margin:10px 0 6px; }
  .door .d{ font-size:14px; color:#5a6b7a; line-height:1.6; }
  .door.admin .t{ color:var(--gold); }
  .door.admin.on{ border-color:var(--gold); background:#faf6ee; box-shadow:0 0 0 3px rgba(156,122,60,.12); }
  .door.admin:hover{ border-color:var(--gold); background:#faf6ee; }
  form{ margin-top:22px; display:none; }
  form.show{ display:block; }
  label{ display:block; font-size:17px; margin-bottom:8px; text-align:left; }
  input{ width:100%; font-size:20px; padding:14px 16px; border:2px solid var(--line); border-radius:10px;
         text-align:center; letter-spacing:.06em; }
  input:focus{ outline:none; border-color:var(--baoyan); }
  button{ width:100%; margin-top:14px; font-size:19px; padding:14px; border:0; border-radius:10px;
          background:var(--baoyan); color:#fff; cursor:pointer; font-weight:600; }
  button:hover{ background:#0e4d76; }
  button:disabled{ background:#8fa5b5; cursor:default; }
  body.pick-admin button{ background:var(--gold); }
  body.pick-admin button:hover{ background:#b08c45; }
  .msg{ margin-top:14px; font-size:16px; min-height:24px; }
  .msg.err{ color:#b3261e; }
  .msg.wait{ color:#5a6b7a; }
  .links{ margin-top:26px; padding-top:20px; border-top:1px dashed var(--line); text-align:left; }
  .links h2{ font-size:15px; color:#5a6b7a; margin:0 0 12px; font-weight:600; letter-spacing:.05em; }
  .links a{ display:flex; align-items:center; gap:10px; padding:12px 14px; margin-bottom:8px;
            border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--ink);
            font-size:16px; background:#fbfcfd; }
  .links a:hover{ border-color:var(--baoyan); background:#f2f7fb; }
  .links a b{ color:var(--baoyan); font-weight:600; }
  .links a span.k{ font-size:20px; }
  .links a small{ display:block; color:#7c8a97; font-size:13px; margin-top:2px; }
  .foot{ margin-top:20px; font-size:13px; color:#7c8a97; line-height:1.75; }
</style>
</head>
<body>
<div class="gate">
  <div class="mark">寶 嚴 禪 寺 ・ 寶 嚴 山</div>
  <h1>倉庫管理系統</h1>
  <p class="sub">常住內部使用　請選擇入口並輸入密碼</p>

  <div class="doors">
    <div class="door" id="d-user" role="button" tabindex="0">
      <div class="ico">🙏</div>
      <div class="t">使用者入口</div>
      <div class="d">各據點執事・志工<br>申請物料、查庫存、看辦法、填表單</div>
    </div>
    <div class="door admin" id="d-admin" role="button" tabindex="0">
      <div class="ico">🗂️</div>
      <div class="t">管理者入口</div>
      <div class="d">倉管・主管・採購・財務・稽核<br>審核、編號、盤點、照會、物流排程</div>
    </div>
  </div>

  <form id="f">
    <label for="pw" id="pwlabel">密碼</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="go" type="submit">進入</button>
  </form>
  <div class="msg" id="msg"></div>

  <div class="links">
    <h2>雲端表單在入口內</h2>
    <p style="font-size:15px;color:#5a6b7a;line-height:1.8;margin:0">
      物料申請、財產／物料登入、物料庫存查詢三個連結，請由上方<b>使用者入口</b>進入後於首頁取用。</p>
  </div>

  <div class="foot">
    本站不對外公開、不被搜尋收錄。內容經加密，未輸入正確密碼無法讀取。<br>
    使用者密碼與管理者密碼不同，請勿轉傳管理者密碼。
  </div>
</div>

  function b64(s){ var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) a[i] = raw.charCodeAt(i); return a; }

  var msg = document.getElementById("msg"),
      pw  = document.getElementById("pw"),
      go  = document.getElementById("go"),
      f   = document.getElementById("f"),
      lab = document.getElementById("pwlabel"),
      dU  = document.getElementById("d-user"),
      dA  = document.getElementById("d-admin");

  function pick(r){
    role = r;
    dU.classList.toggle("on", r === "user");
    dA.classList.toggle("on", r === "admin");
    document.body.classList.toggle("pick-admin", r === "admin");
    lab.textContent = (r === "admin" ? "管理者密碼" : "使用者密碼");
    f.classList.add("show");
    msg.textContent = "";
    pw.value = ""; pw.focus();
  }
  dU.addEventListener("click", function(){ pick("user"); });
  dA.addEventListener("click", function(){ pick("admin"); });
  dU.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" ") pick("user"); });
  dA.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" ") pick("admin"); });

  f.addEventListener("submit", function(e){
    e.preventDefault();
    if (!role || !pw.value) return;
    var p = PAY[role];
    go.disabled = true;
    msg.className = "msg wait";
    msg.textContent = "解密中，請稍候…";

    var enc = new TextEncoder();
    crypto.subtle.importKey("raw", enc.encode(pw.value), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:"PBKDF2", salt:b64(p.s), iterations:ITER, hash:"SHA-256" },
          base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(p.i) }, key, b64(p.d));
      })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        document.open(); document.write(html); document.close();
      })
      .catch(function(){
        go.disabled = false;
        msg.className = "msg err";
        msg.textContent = (role === "admin"
          ? "管理者密碼不正確。（使用者密碼無法進入後台）"
          : "使用者密碼不正確，請再試一次。");
        pw.value = ""; pw.focus();
      });
  });
})();
</script>
</body>
</html>
