<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>寶嚴禪寺・寶嚴山 倉庫管理辦法</title>
<style>
  :root{ --baoyan:#0b3c5d; --ink:#1a1a1a; --line:#d8dee4; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#eef3f7 0%,#dde7ef 100%); color:var(--ink);
        font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif; padding:24px; }
  .gate{ width:100%; max-width:460px; background:#fff; border:1px solid var(--line); border-radius:16px;
         padding:40px 32px; box-shadow:0 10px 40px rgba(11,60,93,.13); text-align:center; }
  .mark{ font-size:15px; letter-spacing:.32em; color:var(--baoyan); margin-bottom:14px; }
  h1{ font-size:27px; line-height:1.45; margin:0 0 10px; color:var(--baoyan); font-weight:700; }
  .sub{ font-size:17px; color:#5a6b7a; margin:0 0 30px; line-height:1.7; }
  label{ display:block; font-size:18px; margin-bottom:10px; text-align:left; }
  input{ width:100%; font-size:21px; padding:15px 16px; border:2px solid var(--line); border-radius:10px;
         text-align:center; letter-spacing:.06em; }
  input:focus{ outline:none; border-color:var(--baoyan); }
  button{ width:100%; margin-top:18px; font-size:20px; padding:15px; border:0; border-radius:10px;
          background:var(--baoyan); color:#fff; cursor:pointer; font-weight:600; }
  button:hover{ background:#0e4d76; }
  button:disabled{ background:#8fa5b5; cursor:default; }
  .msg{ margin-top:18px; font-size:17px; min-height:26px; }
  .msg.err{ color:#b3261e; }
  .msg.wait{ color:#5a6b7a; }
  .foot{ margin-top:26px; font-size:14px; color:#7c8a97; line-height:1.7; }
</style>
</head>
<body>
<div class="gate">
  <div class="mark">寶 嚴 禪 寺 ・ 寶 嚴 山</div>
  <h1>倉庫管理辦法<br>正式發布版</h1>
  <p class="sub">常住內部文件<br>請輸入密碼後閱覽</p>
  <form id="f">
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">進入</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot">內含九章條文與 WH-F01～F12 十二張可填寫表單<br>可線上填寫、列印或存成 PDF</div>
</div>
